<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - MR13 Imports</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <h1>Painel Administrativo</h1>
        <button id="logout-btn">Sair</button>
    </header>
    <main>
        <section class="form-section">
            <h2 id="form-title">Cadastrar Produto</h2>
            <form id="product-form">
                <input type="hidden" id="prod-id">
                <label>Nome:</label>
                <input type="text" id="nome" required>
                <label>Marca:</label>
                <select id="marca" required>
                    <option value="">Selecione</option>
                    <option value="Nike">Nike</option>
                    <option value="Adidas">Adidas</option>
                    <option value="Puma">Puma</option>
                    <option value="Mizuno">Mizuno</option>
                </select>
                <label>Categoria:</label>
                <select id="categoria" required>
                    <option value="">Selecione</option>
                    <option value="Campo">Campo</option>
                    <option value="Society">Society</option>
                    <option value="Futsal">Futsal</option>
                </select>
                <label>Preço:</label>
                <input type="number" id="preco" step="0.01" required>
                <label>Descrição:</label>
                <textarea id="descricao" rows="4"></textarea>
                <label>Imagens:</label>
                <input type="file" id="imagem" accept="image/*" multiple>
                <div id="existing-images" class="images-grid"></div>
                <div id="preview-container" class="images-grid"></div>
                <button type="submit">Salvar</button>
                <button type="button" id="cancel-edit" style="display:none;">Cancelar</button>
            </form>
        </section>
        <section class="list-section">
            <h2>Produtos Cadastrados</h2>
            <input type="text" id="search" placeholder="Pesquisar...">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Imagem</th>
                            <th>Nome</th>
                            <th>Marca</th>
                            <th>Categoria</th>
                            <th>Preço</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="products-tbody"></tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="js/supabase.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
